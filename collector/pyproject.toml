[project]
name = "gcb-collector"
version = "0.1.0"
description = "GENIUSCASHBACK — collecteur de taux de cashback"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Playwright n'est PAS une dépendance de base : on ne l'installe que si un
# adaptateur en a réellement besoin. Widilo n'en a pas besoin.
playwright = ["playwright>=1.45"]

[project.scripts]
gcb = "gcb.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
