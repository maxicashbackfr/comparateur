services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxicash
      POSTGRES_PASSWORD: maxicash
      POSTGRES_DB: maxicash
    ports:
      - "5432:5432"
    volumes:
      - maxicash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxicash"]
      interval: 5s
      retries: 10

volumes:
  maxicash_pgdata:
