name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxicash
          POSTGRES_PASSWORD: maxicash
          POSTGRES_DB: maxicash
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://maxicash:maxicash@localhost:5432/maxicash
      # UA de CI : jamais utilisé pour sortir sur le réseau, les tests
      # tournent exclusivement sur fixtures.
      MAXICASH_USER_AGENT: MaxiCashBot-CI/0.1 (+https://example.invalid/bot)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le collecteur
        working-directory: collector
        run: python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: collector
        run: python -m ruff check src tests

      - name: Migrations
        working-directory: collector
        run: python -m maxicash.cli migrate

      - name: Vérifier que les migrations sont idempotentes
        working-directory: collector
        run: python -m maxicash.cli migrate

      - name: Tests
        working-directory: collector
        run: python -m pytest -q
